<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sign in - Social Auto Publisher</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="./css/style.css" />
</head>
<body class="auth-body">
  <div class="auth-shell">
    <div class="auth-bg-glow"></div>

    <div class="auth-card">
      <div class="auth-mark">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
          <path d="M4 12a8 8 0 0 1 14.5-4.6M20 12a8 8 0 0 1-14.5 4.6" stroke="white" stroke-width="2" stroke-linecap="round"/>
          <path d="M18.5 3.5v4h-4M5.5 20.5v-4h4" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </div>

      <h1>Welcome back</h1>
      <p class="subtitle">Sign in to publish your WordPress articles to social media, automatically.</p>

      <div id="loginAlert" class="alert alert-error hidden"></div>

      <form id="loginForm" autocomplete="off">
        <div class="field">
          <label for="loginUsername">Username</label>
          <input type="text" id="loginUsername" name="username" autocomplete="username" placeholder="admin" required autofocus />
        </div>
        <div class="field">
          <label for="loginPassword">Password</label>
          <div class="password-wrap">
            <input type="password" id="loginPassword" name="password" autocomplete="current-password" placeholder="••••••••" required />
            <button type="button" class="password-toggle" id="togglePassword" aria-label="Show password">
              <svg id="eyeIcon" width="18" height="18" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                <path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7-10-7-10-7Z" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
                <circle cx="12" cy="12" r="3" stroke="currentColor" stroke-width="1.8"/>
              </svg>
            </button>
          </div>
        </div>
        <button type="submit" class="btn btn-primary btn-auth" id="loginSubmit">
          <span id="loginSubmitLabel">Sign in</span>
        </button>
      </form>

      <p class="auth-footnote">Admin access only &middot; credentials are configured on the server</p>
    </div>
  </div>

  <script src="/js/login.js"></script>
</body>
</html>
